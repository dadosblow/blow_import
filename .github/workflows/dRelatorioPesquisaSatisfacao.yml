# This is a basic workflow to help you get started with Actions

name: Download relatório pesquisa de satisfação FULL

permissions: write-all

# Controls when the action will run. 
on:
  schedule:
    - cron: "0 1 * * *" # 22:00 UTC-3 todos os dias
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v2
      - name: execute script py
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          python deletaRelatorioPesquisaSatisfacao.py
          python dRelatorioPesquisaSatisfacao.py
      - name: GitHub Commit & Push Script
        uses: actions-js/push@v1.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          author_email: 'bruno.machado@zhero.com.br'
          author_name: 'zherolabs'
          branch: 'main'
