name: Download relatório Faturamento

permissions:
  contents: write    # permite usar o GITHUB_TOKEN p/ push

on:
  schedule:
    - cron: "0 2 * * *"   # 22:40 BRT (01:40 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: blow-autopublish-main
      cancel-in-progress: false

    steps:
      # 1) Checkout com histórico completo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # usa GITHUB_TOKEN para push

      # 2) Configura o Git no runner
      - name: Config Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3) Garante que a branch local está alinhada com a main remota
      - name: Rebase with remote main
        run: |
          git fetch origin main
          git pull --rebase origin main

      # 4) Roda o script de faturamento
      - name: Setup Python and run script
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          python dRelatorioFaturamento.py

      # 5) Commit só se houver mudanças
      - name: Commit changes (if any)
        run: |
          git add -A
          git commit -m "chore: autopublish $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"

      # 6) Push para main
      - name: Push to main
        run: |
          git push origin HEAD:main
