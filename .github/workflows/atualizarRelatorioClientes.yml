name: Atualizar relatórios de clientes para todas unidades

permissions:
  contents: write

on:
  schedule:
    - cron: "30 0 * * *" # 21:30 UTC-3 todos os dias
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # traz todo o histórico (necessário para pull/rebase)
          persist-credentials: true

      - name: Instalar dependências e executar script
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          python dClientes.py

      - name: Configurar Git e dar pull/rebase
        run: |
          git config user.name "zherolabs"
          git config user.email "bruno.machado@zhero.com.br"
          git pull --rebase origin main

      - name: GitHub Commit & Push Script
        uses: actions-js/push@v1.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          author_email: 'bruno.machado@zhero.com.br'
          author_name: 'zherolabs'
